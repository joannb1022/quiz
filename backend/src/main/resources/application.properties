spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/quiz}
spring.datasource.username=${DATABASE_USERNAME:quiz}
spring.datasource.password=${DATABASE_PASSWORD:quiz}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
google.gemini.api-key=${GEMINI_API_KEY}
google.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
server.port=8080
frontend.url=${FRONTEND_URL:http://localhost:5173}
logging.level.com.quiz=DEBUG